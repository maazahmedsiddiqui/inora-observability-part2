global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'inora_backend'
    static_configs:
      - targets: ['host.docker.internal:5000']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          machine: 'DESKTOP-682RE3R'   

  - job_name: 'cardinality_test'
    static_configs:
      - targets: ['host.docker.internal:8001']

  - job_name: 'cardinality_test_v2'
    static_configs:
      - targets: ['host.docker.internal:8002']