services:
  api:
    build: .
    container_name: inora-api
    ports:
      - "5000:5000"
    environment:
      - LOG_FILE=/app/logs/app.log
      - INORA_DB=/app/data/inora.db
      - INORA_SEED_STOCK=100000
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-5}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-10}
    volumes:
      - ./logs:/app/logs
      - inora-data:/app/data

  grpc:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    container_name: inora-grpc
    ports:
      - "50051:50051"
      - "9102:9102"
    environment:
      - LOG_FILE=/app/logs/grpc.log
      - METRICS_PORT=9102
      - GRPC_SIMULATE_DELAY=${GRPC_SIMULATE_DELAY:-0}
      - INORA_DB=/app/data/inora.db
      - INORA_SEED_STOCK=100000
    volumes:
      - ./logs:/app/logs
      - inora-data:/app/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/usr/share/filebeat/logs:ro
    depends_on:
      - elasticsearch

volumes:
  inora-data:
